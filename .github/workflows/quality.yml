name: CodeCross quality

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q -m "not docker"

  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: docker build -f docker/sandbox-python.Dockerfile -t codecross-sandbox-python:3.12 .
      - run: docker pull node:22-bookworm-slim
      - run: python -m pytest -q -m docker
