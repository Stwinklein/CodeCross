name: CodeCross PR Review

# This workflow reviews pull requests and posts one stable PR comment.
# It uses pull_request instead of pull_request_target so model secrets are not
# exposed to untrusted fork code with elevated repository permissions.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # CodeCross builds the review from the real merge diff, so it needs
          # enough history to compare the PR base commit and head commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CodeCross dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build PR diff
        run: |
          git diff --no-ext-diff --unified=80 \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > codecross-pr.diff

      - name: Run CodeCross review
        id: codecross
        continue-on-error: true
        env:
          # Set CODECROSS_MOCK_LLM=true only for wiring tests. Real PR review
          # should use model secrets so the comment is not a fake result.
          CODECROSS_MOCK_LLM: ${{ vars.CODECROSS_MOCK_LLM || 'false' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-3-5-sonnet-latest' }}
        run: |
          python -m codecross.ci \
            --diff codecross-pr.diff \
            --project-root . \
            --output-comment codecross-comment.md \
            --output-json codecross-state.json

      - name: Build failure comment
        if: ${{ steps.codecross.outcome != 'success' }}
        run: |
          {
            echo '<!-- codecross-pr-review -->'
            echo '## CodeCross PR 审查报告'
            echo ''
            echo '### 结论看板'
            echo ''
            echo '| 项目 | 结果 |'
            echo '| --- | --- |'
            echo '| 运行模式 | 审查完成前失败 |'
            echo '| Commit | `${{ github.event.pull_request.head.sha }}` |'
            echo '| CI 运行 | [打开 Actions 运行](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |'
            echo ''
            echo '### 建议动作'
            echo ''
            echo 'CodeCross 没能完成本次 PR 审查。请查看 Actions 日志，重点检查模型密钥、依赖安装和运行时错误。'
            echo ''
            echo '常见配置项：`DEEPSEEK_API_KEY`, `DEEPSEEK_BASE_URL`, `DEEPSEEK_MODEL`, `ANTHROPIC_API_KEY`, `ANTHROPIC_BASE_URL`, `ANTHROPIC_MODEL`。'
          } > codecross-comment.md

      - name: Post or update PR comment
        if: ${{ always() && hashFiles('codecross-comment.md') != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/github_pr_comment.py \
            --comment-file codecross-comment.md \
            --repo "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}"

      - name: Upload CodeCross artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codecross-review
          path: |
            codecross-pr.diff
            codecross-comment.md
            codecross-state.json
